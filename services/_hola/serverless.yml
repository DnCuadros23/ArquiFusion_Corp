# Fase 0 — prueba de despliegue. Cada integrante debe poder desplegar esto en su Learner Lab.
#   serverless deploy --stage dev   → GET .../dev/hola debe devolver 200
#   serverless remove --stage dev   → al terminar
#
# Nota: no ponemos `org:` aquí porque cada uno tiene la suya (serverless login).
# Si el Framework la pide, agrégala SOLO en tu copia local y no la subas.
service: arquifusion-hola

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole   # sirve en cualquier cuenta de Learner Lab
  environment:
    STAGE: ${sls:stage}

functions:
  hola:
    handler: handler.hola
    events:
      - http:
          path: /hola
          method: get
          cors: true
